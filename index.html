<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>MFindiaInfo - Best Mutual Fund Analytics & Investment Intelligence Platform India</title>
    <meta name="description" content="India's trusted mutual fund aggregator with research-backed analytics. Analyze fund performance, upside capture ratio, CAGR, Sharpe ratio & more. Free portfolio insights with SEBI compliant data." />
    <meta name="keywords" content="mutual fund analytics, mutual fund comparison, SIP calculator, CAGR calculator, upside capture ratio, mutual fund portfolio tracker, best mutual funds India, SEBI compliant, AMFI data, fund performance analysis, mutual fund India, investment analytics, portfolio aggregation" />
    <meta name="author" content="MFindiaInfo" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://mfinindiainfo.com/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mfinindiainfo.com/" />
    <meta property="og:title" content="MFindiaInfo - Smart Mutual Fund Analytics for Indian Investors" />
    <meta property="og:description" content="Make smarter investment decisions with transparent, explainable mutual fund analytics. Free portfolio aggregation and research-backed insights." />
    <meta property="og:image" content="https://mfinindiainfo.com/og-image.png" />
    <meta property="og:site_name" content="MFindiaInfo" />
    <meta property="og:locale" content="en_IN" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://mfinindiainfo.com/" />
    <meta property="twitter:title" content="MFindiaInfo - Best Mutual Fund Analytics Platform" />
    <meta property="twitter:description" content="Analyze mutual funds with research-backed metrics. Free portfolio tracker, SIP calculator, and investment intelligence." />
    <meta property="twitter:image" content="https://mfinindiainfo.com/twitter-image.png" />
    
    <!-- Additional SEO -->
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Geo Tags for India -->
    <meta name="geo.region" content="IN" />
    <meta name="geo.placename" content="India" />
    
    <!-- Language -->
    <meta http-equiv="content-language" content="en-IN" />
    
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- JSON-LD Structured Data for Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "MFindiaInfo",
      "url": "https://mfinindiainfo.com",
      "logo": "https://mfinindiainfo.com/logo.png",
      "description": "India's trusted mutual fund aggregator and investment intelligence platform",
      "areaServed": "India",
      "foundingDate": "2024",
      "sameAs": [
        "https://twitter.com/mfinindiainfo",
        "https://linkedin.com/company/mfinindiainfo",
        "https://youtube.com/@mfinindiainfo"
      ]
    }
    </script>
    
    <!-- JSON-LD for WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MFindiaInfo",
      "url": "https://mfinindiainfo.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://mfinindiainfo.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
